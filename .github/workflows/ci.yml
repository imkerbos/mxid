name: CI

# Quality gate for main and every PR, and the reusable gate release.yml calls
# before it builds an image. Until this existed the ONLY gates were local
# (pre-commit, skippable via SKIP_VERIFY) — so regressions could merge
# unchecked. This runs the same `make verify` chain + the test suite in the
# cloud, so a red check blocks the merge.
#
# Deliberately NOT `push: [dev, main]`. The two branches are pushed together
# and have not diverged since PRs stopped being used, so every commit ran the
# whole suite twice under two ref names. main keeps the push trigger — it is
# what gets tagged; anything that actually merges into dev arrives through the
# pull_request trigger.
#
# govulncheck deliberately does NOT run here — see vuln.yml. It goes red when
# the vulnerability database moves, not when the diff does (3 of the last 6 CI
# failures were exactly that: green at push, red the next morning, no code
# change). As a push gate it only paints unrelated work red. It runs daily on a
# schedule and blocks the release workflow instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_call:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go (build · vet · lint · gormtaglint · test)
    runs-on: ubuntu-latest

    # Postgres so the tests exercise the PG-specific machinery (tenant plugin,
    # SKIP LOCKED, advisory locks, ltree <@, pg_trgm, FK cascades, audit
    # hash-chain) that SQLite can't model. Redis-backed tests use miniredis
    # in-process, so no Redis service is needed.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mxid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.14' # keep in lockstep with go.mod + the CE Dockerfile
          cache: true

      - name: Download modules
        run: go mod download

      - name: verify-mod (go.mod/go.sum in sync)
        run: make verify-mod

      - name: vet
        run: go vet ./...

      - name: build (all packages)
        run: go build ./...

      - name: gormtaglint (garble-safe scan structs)
        run: make verify-gormtags

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # goinstall builds golangci-lint with the setup-go toolchain (1.25.14);
          # the prebuilt v1.64.8 binary is compiled with go1.24 and refuses to
          # analyze a go 1.25 module ("language version used to build golangci-lint
          # is lower than the targeted Go version"). Pin the last v1 (the repo's
          # .golangci.yml is v1 config) and let it build under 1.25.
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

      - name: Apply migrations (seeds role 1 + admin so the e2e tests have FKs)
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "postgres://postgres:postgres@localhost:5432/mxid?sslmode=disable" up

      - name: test (race + Postgres e2e)
        env:
          # e2e tests read this (glebarez KV DSN form); when unset they skip.
          MXID_E2E_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=mxid sslmode=disable"
        run: go test -race ./...

  frontend:
    name: Web (build · exports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 10+: overrides live in pnpm-workspace.yaml (the @babel/core
          # security pin). pnpm 9 doesn't read overrides from there, so a frozen
          # install sees a config that mismatches the lockfile's overrides
          # snapshot and fails (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH).
          version: 10

      - name: verify-exports (package.json exports map exists on disk)
        run: node scripts/verify-exports.mjs

      # These are in `make verify` and in pre-commit, but ran nowhere in CI —
      # and verify-pinned-tag ran nowhere at all, in any gate. It was red: the
      # .env.example a new user copies verbatim still pinned MXID_TAG=v1.8.2,
      # three releases behind, so the documented compose path deployed a build
      # missing every fix in v1.9.x. Cheap, source-only, so they run before the
      # expensive build and fail fast.
      - name: verify (i18n · error extraction · toaster · protocol fields · csp · pinned tag)
        run: |
          make verify-i18n-keys verify-i18n-markers verify-error-extraction \
               verify-toaster-mount verify-protocol-fields verify-csp-hash \
               verify-pinned-tag

      - name: build web (strict)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: test web
        working-directory: web
        # --if-present: only @mxid/shared has a `test` script today; the other
        # workspaces (console, portal) have none, and this must not fail on that.
        run: pnpm -r --if-present test
