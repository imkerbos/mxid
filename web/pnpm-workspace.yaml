packages:
  - 'apps/*'
  - 'packages/*'

# Force a patched @babel/core (transitive via eslint-plugin-react-hooks) to close
# GHSA-4x5r-pxfx-6jf8 (arbitrary file read via sourceMappingURL, <= 7.29.0).
overrides:
  '@babel/core': '^7.29.6'
  # Transitive and dev-only (eslint -> minimatch), so nothing reaches a user.
  # Pinned anyway because a lockfile carrying a known-vulnerable version shows up
  # on every scan of both mirrors: GHSA-mh99-v99m-4gvg, unbounded brace expansion
  # can exhaust memory and kill the process.
  'brace-expansion': '>=5.0.8'

# Not overridden, deliberately: GHSA-qwww-vcr4-c8h2 (react-router, high) is
# fixed only in 8.3.0, a major bump from the 7.x line this project is on. The
# advisory states it "only affects your application if you are using the
# unstable RSC APIs"; both SPAs mount plain BrowserRouter and reference no RSC
# entry point, so the vulnerable path is not reachable here. Revisit when
# react-router 8 is scheduled on its own merits — not as a security fix.
