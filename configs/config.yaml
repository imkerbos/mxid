server:
  port: 10050
  mode: debug # debug/release
  # Issuer URL — externally reachable root for protocol endpoints (OIDC iss,
  # SAML EntityID, CAS root). Prod: same as portal_url (single-domain).
  # Dev: backend port directly.
  issuer_url: "http://localhost:10050"
  # Portal SPA base URL — backend redirects login / consent flows here.
  # Dev: Vite split port. Prod: same origin as issuer (nginx routes /login).
  portal_url: "http://localhost:3501"
  # Console SPA base URL — only used by docs page to render endpoints.
  # Dev: Vite split port for console. Prod: same as issuer_url + /admin path.
  console_url: "http://localhost:3500"
  # Front-end origins permitted to call the backend with credentials. Drives
  # both CORS Access-Control-Allow-Origin and CSRF Origin/Referer matching.
  # The origins of issuer_url / portal_url / console_url below are trusted
  # automatically, so you usually only list extra hosts here. Empty = localhost
  # dev defaults. Single nginx origin (:3500 serves portal + /admin console and
  # proxies /api to the backend), so only :3500 is needed per host.
  allowed_origins:
    - "http://localhost:3500"
    - "http://127.0.0.1:3500"
    # LAN-IP demo host (SPs reach the IdP via this address, so the browser
    # loads the portal/console from it too).
    - "http://192.168.254.200:3500"

database:
  host: host.docker.internal
  port: 5432
  name: mxid
  user: postgres
  # Secret — never committed. Injected via MXID_DATABASE_PASSWORD (.env in dev,
  # secret manager in prod). See .env.example.
  password: ""
  max_open_conns: 50
  max_idle_conns: 10
  log_level: info # silent/error/warn/info

redis:
  host: host.docker.internal
  port: 6379
  db: 0
  # Secret — never committed. Injected via MXID_REDIS_PASSWORD.
  password: ""
  pool_size: 20

# NOTE: idle_timeout / absolute_timeout here are only a LAST-RESORT fallback
# used if the DB security.policy is unreadable. The authoritative values live in
# the DB (security.policy → session, editable in the console Security settings
# page); DefaultSecurityPolicy seeds them (idle 8h / absolute 24h). Editing the
# two timeouts below has no effect while the DB is reachable.
session:
  idle_timeout: 8h
  absolute_timeout: 24h
  cookie_secure: false
  cookie_domain: ""

# Fallback only — authoritative in DB (security.policy, console Security page).
# Seeded by DefaultSecurityPolicy; edits here are inert while the DB is reachable.
security:
  password:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: false
    history_count: 5
    expire_days: 90
    expire_warn_days: 7
  login:
    max_failed_attempts: 5
    lockout_duration: 15m
    captcha_after_failures: 3

tenant:
  default_id: 1

crypto:
  # Base64-encoded 32-byte AES-256 master key. Encrypts OIDC signing private
  # keys at rest and is the root of trust — NEVER committed. Injected via
  # MXID_CRYPTO_KEY_ENCRYPTION_KEY (.env in dev, secret manager in prod).
  # Generate: openssl rand -base64 32
  key_encryption_key: ""
  # Base64-encoded HMAC key sealing the audit hash chain — NEVER committed.
  # Injected via MXID_CRYPTO_AUDIT_CHAIN_KEY (.env in dev, secret manager in
  # prod). Generate: openssl rand -base64 32
  audit_chain_key: ""
  # Base64-encoded ed25519 seed signing audit-anchor checkpoints — NEVER
  # committed. Injected via MXID_CRYPTO_AUDIT_ANCHOR_KEY (.env in dev, secret
  # manager in prod). Generate: openssl rand -base64 32
  audit_anchor_key: ""
  # Comma-separated base64-encoded ed25519 public keys retired from anchoring;
  # keep so their old anchors still verify. Injected via
  # MXID_CRYPTO_AUDIT_ANCHOR_RETIRED_PUBKEYS. Optional.
  audit_anchor_retired_pubkeys: ""

# Periodic signed checkpoints of the audit hash chain. Anchors are recorded in
# mxid_audit_anchor, where they summarise a range in ~375 bytes so it can be
# verified without walking the chain from genesis.
#
# anchor_sink_path additionally mirrors each anchor to a file OUTSIDE the
# database. That is what would catch an operator with database write access
# rewriting history — but only if the path is outside the DB's blast radius AND
# shared by every replica. Anchors are written by whichever replica holds the
# leader lock, so a per-pod volume scatters them and makes verification fail
# depending on which pod runs it. Empty (the default) = checkpoints only.
audit:
  anchor_enabled: true
  anchor_sink_path: ""
  # Prune mxid_audit_entry under the same retention policy as the audit log.
  # OFF by default: dropping a log partition discards a view that can be rebuilt
  # from the ledger, whereas pruning the ledger discards the evidence itself.
  # What remains is the anchor plus a signed checkpoint — enough to prove the
  # rest of the chain is intact and that the pruned range existed, but not what
  # it contained. Leaving it off means the ledger keeps every payload for ever,
  # regardless of the configured retention.
  ledger_retention: false
  # Floor beneath which an administrator cannot shorten audit retention (days).
  # Retention is editable at runtime in the console, so without a floor anyone
  # with settings.manage can dial it down to a week — a way to destroy evidence
  # that leaves no evidence behind. Regimes that mandate a retention period
  # (China's MLPS 2.0 six-month rule among them) are asserting this floor.
  #
  # Commented out = 180 days, which is well under the 365-day retention default
  # and so constrains nobody who has not gone looking for something shorter.
  # Set it to 0 to allow any retention; a lower number to permit a shorter one.
  # A stored value below the floor is raised to it when the purge reads the
  # policy, so raising the floor never deletes anything it did not before.
  # min_retention_days: 180
  # Mirror every audit record to a collector outside the database as it is
  # written. The tamper-evident chain proves nobody rewrote history; it does
  # nothing about someone with database access dropping the table, and an
  # off-host copy is what survives that. It is also what "centralised log
  # management" controls ask for.
  #
  # Empty addr (the default) disables forwarding. Forwarding NEVER blocks the
  # audit write: the queue is bounded and overflow is dropped and counted
  # (mxid_audit_forward_total{result="dropped"}), because a collector that stops
  # reading must not be able to stall every write API in the product.
  forward:
    addr: "" # host:port of the syslog collector
    proto: tcp # udp | tcp | tcp+tls — udp cannot tell you records stopped arriving
    # facility: 13    # syslog facility; 13 = "log audit", what collectors route on
    # queue_size: 4096
    # tls_server_name: ""            # when dialling tcp+tls by IP
    # tls_insecure_skip_verify: false # turns the transport into obfuscation; last resort

log:
  level: info # debug/info/warn/error
  format: json # json/text
  output: stdout # stdout/file
  file_path: logs/mxid.log

snowflake:
  node_id: 1
